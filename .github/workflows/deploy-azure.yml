name: Deploiement SuiviColis sur Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # jeton OIDC pour se connecter a Azure sans mot de passe
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Installation des dependances
        run: npm install --omit=dev

      - name: Connexion a Azure (identite managee, OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploiement sur app-suivicolis-lns
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-suivicolis-lns
          package: .
